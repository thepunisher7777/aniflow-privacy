<body>
<div id="app" class="app-shell"><header class="topbar"><div><div class="eyebrow">FLOWFI</div><h1 id="page-title">Inicio</h1></div><button id="month-button" class="month-pill"><span id="month-label"></span><span class="chevron">⌄</span></button></header><main id="main" class="main"></main><button id="fab" class="fab">+</button><nav class="bottom-nav"><button class="nav-item active" data-route="home"><span class="nav-icon">⌂</span><span>Inicio</span></button><button class="nav-item" data-route="transactions"><span class="nav-icon">≡</span><span>Movimientos</span></button><button class="nav-item" data-route="plan"><span class="nav-icon">◎</span><span>Plan</span></button><button class="nav-item" data-route="settings"><span class="nav-icon">⚙︎</span><span>Ajustes</span></button></nav></div>
<dialog id="transaction-dialog" class="sheet"><form method="dialog" id="transaction-form" class="sheet-card"><div class="sheet-handle"></div><div class="sheet-head"><div><div class="eyebrow">MOVIMIENTO</div><h2 id="transaction-title">Añadir gasto</h2></div><button type="button" class="icon-btn" data-close="transaction-dialog">✕</button></div><div class="segmented"><button type="button" class="segment active" data-tx-type="expense">Gasto</button><button type="button" class="segment" data-tx-type="income">Ingreso</button></div><label class="amount-field"><span>Importe</span><div><input id="tx-amount" inputmode="decimal" placeholder="0,00"/><b>€</b></div></label><div class="form-section"><label>Categoría</label><div id="category-chips" class="chips"></div></div><div class="form-grid"><label>Cuenta<select id="tx-account"></select></label><label>Fecha<input id="tx-date" type="date"/></label></div><label>Nota<input id="tx-note" maxlength="80" placeholder="Opcional"/></label><button id="save-transaction" type="button" class="primary-btn">Guardar movimiento</button></form></dialog>
<dialog id="month-dialog" class="sheet small-sheet"><form method="dialog" class="sheet-card compact-sheet"><div class="sheet-handle"></div><div class="sheet-head"><h2>Mes</h2><button type="button" class="icon-btn" data-close="month-dialog">✕</button></div><div class="month-switcher"><button type="button" id="prev-month" class="soft-btn">← Anterior</button><strong id="month-dialog-label"></strong><button type="button" id="next-month" class="soft-btn">Siguiente →</button></div></form></dialog>
<dialog id="budget-dialog" class="sheet small-sheet"><form method="dialog" class="sheet-card compact-sheet"><div class="sheet-handle"></div><div class="sheet-head"><h2>Presupuesto</h2><button type="button" class="icon-btn" data-close="budget-dialog">✕</button></div><label>Categoría<select id="budget-category"></select></label><label>Límite mensual (€)<input id="budget-amount" inputmode="decimal" placeholder="200"/></label><button id="save-budget" type="button" class="primary-btn">Guardar presupuesto</button></form></dialog>
<dialog id="recurring-dialog" class="sheet small-sheet"><form method="dialog" class="sheet-card compact-sheet"><div class="sheet-handle"></div><div class="sheet-head"><h2>Gasto fijo</h2><button type="button" class="icon-btn" data-close="recurring-dialog">✕</button></div><label>Nombre<input id="rec-name" maxlength="60" placeholder="Alquiler, gimnasio..."/></label><label>Importe mensual (€)<input id="rec-amount" inputmode="decimal" placeholder="0,00"/></label><div class="form-grid"><label>Día del mes<input id="rec-day" type="number" min="1" max="31" value="1"/></label><label>Categoría<select id="rec-category"></select></label></div><button id="save-recurring" type="button" class="primary-btn">Añadir gasto fijo</button></form></dialog>
<dialog id="goal-dialog" class="sheet small-sheet"><form method="dialog" class="sheet-card compact-sheet"><div class="sheet-handle"></div><div class="sheet-head"><h2>Objetivo</h2><button type="button" class="icon-btn" data-close="goal-dialog">✕</button></div><label>Nombre<input id="goal-name" maxlength="60" placeholder="Colchón, viaje, moto..."/></label><div class="form-grid"><label>Objetivo (€)<input id="goal-target" inputmode="decimal" placeholder="10000"/></label><label>Ahorrado (€)<input id="goal-current" inputmode="decimal" placeholder="0"/></label></div><button id="save-goal" type="button" class="primary-btn">Crear objetivo</button></form></dialog>
<dialog id="import-dialog" class="sheet small-sheet"><form method="dialog" class="sheet-card compact-sheet"><div class="sheet-handle"></div><div class="sheet-head"><h2>Importar</h2><button type="button" class="icon-btn" data-close="import-dialog">✕</button></div><p class="muted">Acepta el CSV de Monefy y CSV genéricos con fecha, importe, categoría y descripción.</p><input id="import-file" type="file" accept=".csv,.json,text/csv,application/json"/><div id="import-status" class="notice hidden"></div><button id="run-import" type="button" class="primary-btn">Importar archivo</button></form></dialog><div id="toast" class="toast"></div>
<script>
(()=>{'use strict';const STORAGE_KEY='flowfi.v1';const CATEGORIES=[['Comida','🍽️'],['Restaurante','🍜'],['Casa','🏠'],['Facturas','🧾'],['Transporte','🚆'],['Automóvil','🚗'],['Deportes','🏋️'],['Salud','🩺'],['Ocio','🎮'],['Entretenimiento','🎬'],['Regalos','🎁'],['Viajes','✈️'],['Compras','🛍️'],['Otros','•'],['Salario','💼']];const EXPENSE_CATEGORIES=CATEGORIES.filter(([n])=>n!=='Salario');const ICONS=Object.fromEntries(CATEGORIES);const euro=new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR',maximumFractionDigits:2}),monthFmt=new Intl.DateTimeFormat('es-ES',{month:'long',year:'numeric'}),dayFmt=new Intl.DateTimeFormat('es-ES',{day:'2-digit',month:'short'}),now=new Date();const def=()=>({version:1,settings:{currency:'EUR',monthlySavingsTarget:0},accounts:['Principal','Efectivo'],transactions:[],budgets:{},recurring:[],goals:[]});let state=(()=>{try{const r=localStorage.getItem(STORAGE_KEY);return r?{...def(),...JSON.parse(r)}:def()}catch{return def()}})(),selectedMonth=new Date(now.getFullYear(),now.getMonth(),1),route='home',txType='expense',selectedCategory='Comida';const el=id=>document.getElementById(id),main=el('main'),save=()=>localStorage.setItem(STORAGE_KEY,JSON.stringify(state)),uid=()=>crypto.randomUUID?.()||`${Date.now()}-${Math.random()}`,iso=d=>{d=d||new Date();const z=new Date(d.getTime()-d.getTimezoneOffset()*6e4);return z.toISOString().slice(0,10)},money=v=>Number(String(v).trim().replace(/\s/g,'').replace(/\./g,'').replace(',','.'))||0,fmt=v=>euro.format(v),mk=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`,txs=()=>state.transactions.filter(t=>String(t.date).slice(0,7)===mk(selectedMonth)).sort((a,b)=>String(b.date).localeCompare(String(a.date))),dim=d=>new Date(d.getFullYear(),d.getMonth()+1,0).getDate(),current=()=>mk(selectedMonth)===mk(now),fixed=()=>{const ex=txs().filter(t=>t.recurringId).map(t=>t.recurringId),today=current()?now.getDate():0;return state.recurring.filter(r=>!ex.includes(r.id)&&+r.day>=today).reduce((s,r)=>s+(+r.amount||0),0)},tot=()=>{const a=txs(),income=a.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0),expenses=a.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0),upcomingFixed=fixed();return{income,expenses,upcomingFixed,free:income-expenses-upcomingFixed-(+state.settings.monthlySavingsTarget||0)}},spend=()=>{const o={};txs().filter(t=>t.type==='expense').forEach(t=>o[t.category]=(o[t.category]||0)+t.amount);return Object.entries(o).sort((a,b)=>b[1]-a[1])},esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])),cap=s=>s.charAt(0).toUpperCase()+s.slice(1),empty=(a,b)=>`<div class="empty-state"><b>${esc(a)}</b>${esc(b)}</div>`;function setRoute(r){route=r;document.querySelectorAll('.nav-item').forEach(b=>b.classList.toggle('active',b.dataset.route===r));el('page-title').textContent={home:'Inicio',transactions:'Movimientos',plan:'Plan',settings:'Ajustes'}[r];el('fab').style.display=r==='settings'?'none':'';render()}function categoryRow(c,a){const b=+state.budgets[c]||0,p=b?Math.min(100,a/b*100):0;return`<div class="category-row"><span class="category-icon">${ICONS[c]||'•'}</span><div class="row-main"><div class="row-title">${esc(c)}</div><div class="row-sub">${b?`${fmt(a)} de ${fmt(b)}`:`${fmt(a)} este mes`}</div>${b?`<div class="mini-bar ${a>b?'over':''}"><span style="width:${p}%"></span></div>`:''}</div><div class="row-amount">${b?`${Math.round(a/b*100)}%`:''}</div></div>`}function trow(t){return`<div class="transaction-row"><span class="category-icon">${ICONS[t.category]||'•'}</span><div class="row-main"><div class="row-title">${esc(t.note||t.category)}</div><div class="row-sub">${esc(t.category)} · ${esc(t.account||'Principal')} · ${dayFmt.format(new Date(`${t.date}T12:00:00`))}</div></div><div class="row-amount ${t.type==='income'?'positive':''}">${t.type==='income'?'+':'−'}${fmt(t.amount)}</div><button class="delete-btn" data-delete-tx="${t.id}">×</button></div>`}function insights(t,s){if(!state.transactions.length&&!state.recurring.length)return[{title:'Empieza por lo mínimo',text:'Añade un movimiento o importa tu CSV de Monefy.'}];const o=[],day=current()?now.getDate():dim(selectedMonth),elapsed=Math.max(1,day/dim(selectedMonth));for(const[c,a]of s){const b=+state.budgets[c]||0;if(!b)continue;const e=b*elapsed;if(a>b)o.push({level:'danger',title:`${c}: presupuesto superado`,text:`Llevas ${fmt(a)} frente a ${fmt(b)}.`});else if(a>e*1.2)o.push({level:'warn',title:`${c} va rápido`,text:`Llevas ${fmt(a)}; al ritmo tocarían ${fmt(e)}.`})}if(t.upcomingFixed>0)o.push({title:'Fijos todavía pendientes',text:`Reserva ${fmt(t.upcomingFixed)} para los pagos que aún no han llegado.`});if(state.settings.monthlySavingsTarget>0)o.push({title:t.free>=0?'Objetivo de ahorro protegido':'Tu plan necesita ajuste',text:t.free>=0?`Tras reservar ${fmt(state.settings.monthlySavingsTarget)}, quedan ${fmt(t.free)} libres.`:`El mes queda en ${fmt(t.free)}.`});if(!o.length)o.push({title:'Mes bajo control',text:'No hay alertas relevantes con lo que llevas registrado.'});return o.slice(0,3)}function renderHome(){const t=tot(),s=spend(),ins=insights(t,s);main.innerHTML=`<section class="hero-card"><div class="hero-top"><div class="hero-label">Libre del mes</div><div class="hero-value ${t.free<0?'negative':''}">${fmt(t.free)}</div><div class="hero-sub">Tras movimientos, gastos fijos pendientes y tu objetivo de ahorro.</div></div><div class="kpis"><div class="kpi"><span>Ingresos</span><b class="positive">${fmt(t.income)}</b></div><div class="kpi"><span>Gastado</span><b>${fmt(t.expenses)}</b></div><div class="kpi"><span>Fijos pendientes</span><b>${fmt(t.upcomingFixed)}</b></div></div></section><section class="section"><div class="section-head"><h2>Radar</h2><button id="go-plan">Ver plan</button></div>${ins.map(i=>`<div class="insight ${i.level||''}"><span class="insight-dot"></span><div><b>${esc(i.title)}</b><p>${esc(i.text)}</p></div></div>`).join('')}</section><section class="section"><
